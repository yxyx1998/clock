<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><title>慈溪时钟 · 天气增强版</title><style>html,body{margin:0;width:100%;height:100%;background:#000;color:#f5f5f5;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}#scene{position:absolute;left:0;top:0;width:100%;height:100%}svg{display:block;width:100%;height:100%}#retry{cursor:pointer} </style></head><body><div id="scene"><svg id="display" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1024" preserveAspectRatio="xMidYMid meet"><g id="face"></g><g id="hands"><line id="hour" stroke="#f7f7fa" stroke-width="13" stroke-linecap="round"/><line id="minute" stroke="#f7f7fa" stroke-width="10" stroke-linecap="round"/><line id="second" stroke="#e74b4c" stroke-width="3.4" stroke-linecap="round"/><circle id="pin" r="10" fill="#f8f8fa"/><circle id="pin2" r="3.4" fill="#a6a6a8"/></g><g id="info"><text id="weekday" font-size="70" font-weight="500" fill="#fff">星期日</text><text id="date" font-size="33" fill="#aaa">日期</text><line id="rule1" stroke="#454545" stroke-width="2"/><text id="weathericon" font-size="50" fill="#f2f2f2">○</text><text id="temperature" font-size="70" fill="#fff">--°C</text><text id="condition" font-size="27" fill="#e1e1e1">天气加载中</text><text id="highlow" font-size="23" fill="#999">慈溪</text><line id="rule2" stroke="#454545" stroke-width="2"/><text id="city" font-size="25" fill="#aaa">慈溪</text><text id="digital" font-size="37" fill="#eee">--:--</text><text id="ampm" font-size="18" fill="#999"></text><text id="retry" font-size="18" fill="#888" style="display:none">点击重试天气</text></g></svg></div><script>(function(){'use strict';var NS='http://www.w3.org/2000/svg';function el(id){return document.getElementById(id)}function attr(node,values){for(var k in values){if(values.hasOwnProperty(k))node.setAttribute(k,values[k])}}function text(id,v){el(id).textContent=v}var face=el('face'),CX=520,CY=512,R=443;for(var n=1;n<=12;n++){var a=(n*30-90)*Math.PI/180;var tickMark=document.createElementNS(NS,'line');attr(tickMark,{x1:CX+Math.cos(a)*(R-8),y1:CY+Math.sin(a)*(R-8),x2:CX+Math.cos(a)*(R-30),y2:CY+Math.sin(a)*(R-30),stroke:'#ddd','stroke-width':3.4});face.appendChild(tickMark);var num=document.createElementNS(NS,'text');attr(num,{x:CX+Math.cos(a)*(R-81),y:CY+Math.sin(a)*(R-81)+18,'text-anchor':'middle','font-size':59,'font-weight':400,fill:'#f6f6f6'});num.textContent=n;face.appendChild(num)}function hand(id,angle,length,tail){var a=(angle-90)*Math.PI/180;attr(el(id),{x1:CX-Math.cos(a)*tail,y1:CY-Math.sin(a)*tail,x2:CX+Math.cos(a)*length,y2:CY+Math.sin(a)*length})}function pad(v){return v<10?'0'+v:''+v}var days=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];function tick(){var d=new Date(),h=d.getHours(),m=d.getMinutes(),s=d.getSeconds(),ms=d.getMilliseconds();hand('hour',(h%12+m/60+s/3600)*30,184,15);hand('minute',(m+s/60)*6,305,19);hand('second',(s+ms/1000)*6,343,47);text('weekday',days[d.getDay()]);text('date',(d.getMonth()+1)+'月'+d.getDate()+'日');text('digital',pad(h)+':'+pad(m));text('ampm',h<12?'AM':'PM')}function position(){var w=window.innerWidth||1024,h=window.innerHeight||768,portrait=h>w,svg=el('display');if(portrait){attr(svg,{viewBox:'0 0 1024 1440'});CX=512;CY=520;R=440;attr(el('info'),{transform:'translate(-25 870) scale(1.05)'});layout(0,0,0,true)}else{attr(svg,{viewBox:'0 0 1440 1024'});CX=520;CY=512;R=443;attr(el('info'),{transform:''});layout(0,0,0,false)}while(face.firstChild)face.removeChild(face.firstChild);for(var n=1;n<=12;n++){var a=(n*30-90)*Math.PI/180,t=document.createElementNS(NS,'line');attr(t,{x1:CX+Math.cos(a)*(R-8),y1:CY+Math.sin(a)*(R-8),x2:CX+Math.cos(a)*(R-30),y2:CY+Math.sin(a)*(R-30),stroke:'#ddd','stroke-width':3.4});face.appendChild(t);var num=document.createElementNS(NS,'text');attr(num,{x:CX+Math.cos(a)*(R-81),y:CY+Math.sin(a)*(R-81)+18,'text-anchor':'middle','font-size':59,fill:'#f6f6f6'});num.textContent=n;face.appendChild(num)}attr(el('pin'),{cx:CX,cy:CY});attr(el('pin2'),{cx:CX,cy:CY});tick()}function layout(x,y,z,portrait){var start=portrait?280:1050, width=portrait?690:325;attr(el('weekday'),{x:start,y:portrait?80:300,'font-size':portrait?65:70});attr(el('date'),{x:start,y:portrait?128:368});attr(el('rule1'),{x1:start,y1:portrait?160:420,x2:start+width,y2:portrait?160:420});attr(el('weathericon'),{x:start,y:portrait?230:525});attr(el('temperature'),{x:start+145,y:portrait?230:530});attr(el('condition'),{x:start,y:portrait?279:582});attr(el('highlow'),{x:start,y:portrait?321:630});attr(el('rule2'),{x1:start,y1:portrait?357:680,x2:start+width,y2:portrait?357:680});attr(el('city'),{x:start,y:portrait?413:750});attr(el('digital'),{x:start+105,y:portrait?415:751});attr(el('ampm'),{x:start+270,y:portrait?406:742});attr(el('retry'),{x:start,y:portrait?465:805})}function weather(){
 text('condition','正在获取天气');text('highlow','慈溪');el('retry').style.display='none';
 var urls=[
 'https://api.open-meteo.com/v1/forecast?latitude=30.17&longitude=121.27&current_weather=true&daily=temperature_2m_max%2Ctemperature_2m_min&timezone=Asia%2FShanghai&forecast_days=1',
 'https://wttr.in/Cixi?format=j1'
 ];
 var finished=false;
 function show(temp,code,hi,lo,description){
 if(finished)return;finished=true;

 var cond=description||((code===0)?'晴':(code<=3)?'多云':(code===45||code===48)?'雾':(code>=51&&code<=67)?'雨':(code>=71&&code<=77)?'雪':(code>=80&&code<=82)?'阵雨':(code>=95)?'雷雨':'天气');
 text('condition',cond);
 text('weathericon',code===0?'☼':code<=3?'☁':code>=71&&code<=77?'❄':'☂');
 text('highlow',isFinite(hi)&&isFinite(lo)?'最高 '+Math.round(hi)+'°C   最低 '+Math.round(lo)+'°C':'慈溪实时天气');
 el('retry').style.display='none';
 }
 function fail(){if(finished)return;finished=true;text('temperature','--°C');text('condition','天气暂不可用');text('highlow','请检查网络或稍后重试');el('retry').style.display='block'}
 function request(i){if(finished)return;if(i>=urls.length){fail();return}
 var xhr=new XMLHttpRequest(),done=false;

 xhr.onreadystatechange=function(){if(xhr.readyState!==4||done)return;if(xhr.status>=200&&xhr.status<300){try{
 var d=JSON.parse(xhr.responseText);
 if(i===0){var c=d.current_weather||{},day=d.daily||{};if(typeof c.temperature==='number'){done=true;show(c.temperature,c.weathercode,day.temperature_2m_max?day.temperature_2m_max[0]:NaN,day.temperature_2m_min?day.temperature_2m_min[0]:NaN);return}}
 else{var cc=d.current_condition&&d.current_condition[0],dd=d.weather&&d.weather[0];if(cc&&isFinite(parseFloat(cc.temp_C))){done=true;var desc=cc.lang_zh&&cc.lang_zh[0]?cc.lang_zh[0].value:'';show(parseFloat(cc.temp_C),3,dd?parseFloat(dd.maxtempC):NaN,dd?parseFloat(dd.mintempC):NaN,desc||'实时天气');return}}
 }catch(e){} }next()};xhr.onerror=next;xhr.ontimeout=next;xhr.send();
 }catch(e){next()}
 }
 request(0)
 }el('retry').onclick=weather;window.onresize=position;position();setInterval(tick,1000);weather();setInterval(weather,1800000)})();</script></body></html>
